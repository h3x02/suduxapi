# Sudux production deployment (single VPS, Docker Compose).
#
# Secrets are NEVER hardcoded here: every ${VAR:?...} is required and must be
# provided via the .env file next to this compose file (see .env.example).
# Postgres and Redis are NOT published to the host - they are only reachable
# on the internal `backend` network via Docker service names.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sudux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` - Postgres is internal-only. Reach it from the host via:
    #   docker compose exec postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    expose:
      - "5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sudux-redis
    restart: unless-stopped
    # No `ports:` - Redis is internal-only.
    expose:
      - "6379"
    networks:
      - backend
    # Small RDB snapshot as crash protection for matchmaking/queue state.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot migration runner (000001 + 000002_match_deadline).
  # App services wait for `service_completed_successfully`, so nothing talks to
  # the DB before the schema is current. The API also runs migrations at
  # startup as a belt-and-braces re-check (they are idempotent).
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: sudux-migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations/"
      - "-database=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
      - "up"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sudux-api
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      AUTH_CODE_TTL: ${AUTH_CODE_TTL:-5m}
      AUTH_CODE_MAX_ATTEMPTS: ${AUTH_CODE_MAX_ATTEMPTS:-5}
      AUTH_RESEND_COOLDOWN: ${AUTH_RESEND_COOLDOWN:-60s}
      AUTH_MAX_REQUESTS_PER_EMAIL: ${AUTH_MAX_REQUESTS_PER_EMAIL:-5}
      AUTH_MAX_REQUESTS_PER_IP: ${AUTH_MAX_REQUESTS_PER_IP:-20}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  matchmaker:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile.matchmaker
    container_name: sudux-matchmaker
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # config.Validate() requires these in production even though the
      # matchmaker itself neither serves HTTP nor sends email.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      MATCH_MAX_DURATION: ${MATCH_MAX_DURATION:-30m}
      DISCONNECT_GRACE: ${DISCONNECT_GRACE:-60s}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  game-server:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile.game-server
    container_name: sudux-game-server
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      # Required by shared config.Validate() in production (same as matchmaker).
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      MATCH_MAX_DURATION: ${MATCH_MAX_DURATION:-30m}
      DISCONNECT_GRACE: ${DISCONNECT_GRACE:-60s}
      ROOM_EVICT_AFTER: ${ROOM_EVICT_AFTER:-10m}
      MOVE_MIN_INTERVAL: ${MOVE_MIN_INTERVAL:-250ms}
      WRONG_MOVE_COOLDOWN: ${WRONG_MOVE_COOLDOWN:-2s}
      WRONG_MOVE_PENALTY: ${WRONG_MOVE_PENALTY:-50}
    ports:
      - "${GAME_WS_PORT:-8081}:8081"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
